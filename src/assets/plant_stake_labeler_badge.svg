<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" id="rawSvgA">
                <defs>
                  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#064e3b"></stop>
                    <stop offset="100%" stop-color="#022c22"></stop>
                  </linearGradient>
                  <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#34d399"></stop>
                    <stop offset="100%" stop-color="#059669"></stop>
                  </linearGradient>
                  <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
                    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"></feDropShadow>
                  </filter>
                </defs>
                
                <!-- Badge circle background -->
                <circle cx="256" cy="256" r="230" fill="url(#bgGrad)" stroke="#10b981" stroke-width="6"></circle>
                
                <g filter="url(#shadow)">

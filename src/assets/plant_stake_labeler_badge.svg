                  <path d="M 216 170 A 40 40 0 0 1 296 170 L 296 320 C 296 330 286 345 276 355 L 256 385 L 236 355 C 226 345 216 330 216 320 Z" fill="#ffffff"></path>
                  
                  <!-- Hole -->
                  <circle cx="256" cy="170" r="10" fill="#022c22"></circle>
                  
                  <!-- Barcode representing print / labeling -->
                  <g fill="#022c22" opacity="0.85">
                    <rect x="232" y="200" width="4" height="40"></rect>
                    <rect x="240" y="200" width="8" height="40"></rect>
                    <rect x="252" y="200" width="2" height="40"></rect>
                    <rect x="258" y="200" width="6" height="40"></rect>
                    <rect x="268" y="200" width="4" height="40"></rect>
                    <rect x="276" y="200" width="8" height="40"></rect>
                  </g>
                  
                  <!-- Text label -->
                  <text x="256" y="262" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="900" fill="#022c22" letter-spacing="2" text-anchor="middle">PSL</text>
                  
                  <!-- Leaf wrapping -->
                  <path d="M 230 300 C 180 290 150 250 150 200 C 180 190 220 210 232 250 C 238 270 234 290 230 300 Z" fill="url(#leafGrad)"></path>
                  
                  <!-- Leaf vein -->

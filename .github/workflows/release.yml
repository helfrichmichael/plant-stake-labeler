name: Build and Package Desktop Releases

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compile Angular production bundle
        run: npm run build

      - name: Package macOS distribution
        run: |
          mkdir -p package-macos/plant-stake-labeler
          cp start.command server.py config.example.json MC_Label.lsc README.md package-macos/plant-stake-labeler/
          cp -r dist package-macos/plant-stake-labeler/
          chmod +x package-macos/plant-stake-labeler/start.command package-macos/plant-stake-labeler/server.py
          cd package-macos
          zip -r ../plant-stake-labeler-macos.zip plant-stake-labeler
          cd ..

      - name: Package Windows distribution
        run: |
          mkdir -p package-windows/plant-stake-labeler
          cp start.bat server.py config.example.json MC_Label.lsc README.md package-windows/plant-stake-labeler/
          cp -r dist package-windows/plant-stake-labeler/
          cd package-windows
          zip -r ../plant-stake-labeler-windows.zip plant-stake-labeler
          cd ..

      - name: Create GitHub Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: Release ${{ inputs.tag_name || github.ref_name }}
          files: |
            plant-stake-labeler-macos.zip
            plant-stake-labeler-windows.zip
          generate_release_notes: true
          draft: false
          prerelease: false

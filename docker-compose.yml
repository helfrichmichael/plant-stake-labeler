services:
  plant-stake-labeler:
    image: helfrichmichael/plant-stake-labeler:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plant-stake-labeler
    restart: unless-stopped
    ports:
      - "4200:4200"
    environment:
      - DATA_DIR=/app/data
    volumes:
      # Mount single data directory (stores config.json, print_history.json, etc.)
      - ./data:/app/data
